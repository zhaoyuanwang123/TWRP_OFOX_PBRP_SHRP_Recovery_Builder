name: OrangeFox [OFRP]

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Manifest Branch'
        required: true
        default: '14.1'
        type: choice
        options:
          - 14.1
          - 12.1
      DEVICE_TREE:
        description: '你的设备树仓库 URL'
        required: true
        default: 'https://github.com/zhaoyuanwang123/pad2'   # 改成你的实际仓库
      DEVICE_TREE_BRANCH:
        description: '设备树分支'
        required: true
        default: 'main'                                                         # 改成你的实际分支
      DEVICE_NAME:
        description: '设备代号（必须与 twrp_XXX.mk 中的 XXX 一致）'
        required: true
        default: 'rod2'                                                         # 根据 twrp_rod2.mk 填写
      DEVICE_PATH:
        description: '设备树在源码中的路径（必须与 BoardConfig.mk 中的 DEVICE_PATH 一致）'
        required: true
        default: 'device/honor/rod2'                                            # 根据你的 BoardConfig.mk 填写
      BUILD_TARGET:
        description: '构建目标'
        required: true
        default: 'recovery'
        type: choice
        options:
          - boot
          - recovery
          - vendorboot
      LDCHECK:
        description: '启用依赖检查（可选）'
        required: false
        default: 'false'
        type: boolean
      LDCHECKPATH:
        description: '检查目标二进制路径'
        required: true
        default: 'system/bin/qseecomd'

jobs:
  build:
    name: Build OFRP for ${{ github.actor }}
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ORANGEFOX_ROOT: ${{ github.workspace }}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
      OUTPUT_DIR: ${{ github.workspace }}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ inputs.DEVICE_NAME }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean-up
        uses: rokibhasansagar/slimhub_actions@main

      - name: Swap Space (16GB)
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 16

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y aria2 bc bison flex build-essential git gnupg \
            gperf libxml2-utils python3 python3-jinja2 libncurses5-dev \
            zlib1g-dev libssl-dev liblz4-tool libzstd-dev

      - name: Setup Android Build Environment
        run: |
          git clone https://gitlab.com/OrangeFox/misc/scripts.git
          cd scripts
          sudo bash setup/android_build_env.sh

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-${{ inputs.DEVICE_NAME }}-${{ inputs.MANIFEST_BRANCH }}
          max-size: "12G"
          save: true
          restore: true

      - name: Initialize OrangeFox Manifest
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/OrangeFox
          cd ${GITHUB_WORKSPACE}/OrangeFox
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git clone https://gitlab.com/OrangeFox/sync.git -b master
          cd sync
          ./orangefox_sync.sh --branch ${{ inputs.MANIFEST_BRANCH }} --path ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}

      - name: Clone Device Tree
        run: |
          cd ${{ env.ORANGEFOX_ROOT }}
          git clone ${{ inputs.DEVICE_TREE }} -b ${{ inputs.DEVICE_TREE_BRANCH }} ./${{ inputs.DEVICE_PATH }}
          cd ${{ inputs.DEVICE_PATH }}
          echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

      # 关键步骤：从你的 Release 下载内核
      - name: Download Prebuilt Kernel
        run: |
          cd ${{ env.ORANGEFOX_ROOT }}/${{ inputs.DEVICE_PATH }}
          KERNEL_URL="https://github.com/zhaoyuanwang123/pad2/releases/download/1/kernel"
          echo "Downloading kernel from $KERNEL_URL ..."
          curl -L -o kernel "$KERNEL_URL" \
            -H "User-Agent: Mozilla/5.0" \
            --fail --retry 3 --retry-delay 2
          if [ -f "kernel" ]; then
            echo "Kernel downloaded successfully ($(ls -lh kernel | awk '{print $5}'))"
            chmod 644 kernel
          else
            echo "::error::Failed to download kernel!"
            exit 1
          fi

      - name: Build OrangeFox
        run: |
          cd ${{ env.ORANGEFOX_ROOT }}
          set +e
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          sed -i 's/return sandboxConfig\.working/return false/g' build/soong/ui/build/sandbox_linux.go
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export TARGET_PRODUCT=twrp_rod2
          export TARGET_BUILD_VARIANT=eng
          export TARGET_BUILD_TYPE=release
          set -e
          make clean
          mka adbd recoveryimage
          popd

      - name: Set Build Date (UTC)
        run: echo "BUILD_DATE=$(TZ=UTC date +%Y%m%d)" >> $GITHUB_ENV

      - name: Locate and Verify Output Files
        id: locate_outputs
        run: |
          img_file=$(find "${{ env.OUTPUT_DIR }}" -maxdepth 1 -type f -name "${{ inputs.BUILD_TARGET }}.img" -print -quit)
          zip_file=$(find "${{ env.OUTPUT_DIR }}" -maxdepth 1 -type f -name "OrangeFox*.zip" -print -quit)
          tar_file=$(find "${{ env.OUTPUT_DIR }}" -maxdepth 1 -type f -name "OrangeFox*.tar" -print -quit)

          if [ -n "$img_file" ]; then
            echo "img_file=$img_file" >> $GITHUB_OUTPUT
            echo "img_md5=$(md5sum "$img_file" | cut -d ' ' -f1)" >> $GITHUB_OUTPUT
            echo "CHECK_IMG=true" >> $GITHUB_ENV
          else
            echo "::warning::No ${{ inputs.BUILD_TARGET }}.img found!"
          fi

          if [ -n "$zip_file" ]; then
            echo "zip_file=$zip_file" >> $GITHUB_OUTPUT
            echo "zip_md5=$(md5sum "$zip_file" | cut -d ' ' -f1)" >> $GITHUB_OUTPUT
            echo "CHECK_ZIP=true" >> $GITHUB_ENV
          else
            echo "::warning::No OrangeFox.zip found."
          fi

          if [ -n "$tar_file" ]; then
            echo "tar_file=$tar_file" >> $GITHUB_OUTPUT
          fi

      - name: Upload to Release
        if: env.CHECK_IMG == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.locate_outputs.outputs.img_file }}
            ${{ steps.locate_outputs.outputs.zip_file }}
            ${{ steps.locate_outputs.outputs.tar_file }}
            ${{ env.OUTPUT_DIR }}/ramdisk-recovery.*
          name: Unofficial OrangeFox for ${{ inputs.DEVICE_NAME }} (${{ env.BUILD_DATE }})
          tag_name: ${{ github.run_id }}
          body: |
            **Build Info**
            - Manifest Branch: `${{ inputs.MANIFEST_BRANCH }}`
            - Device Tree: [${{ inputs.DEVICE_TREE }}](tree/${{ inputs.DEVICE_TREE_BRANCH }})
            - Commit: [${{ env.COMMIT_ID }}](${{ inputs.DEVICE_TREE }}/commit/${{ env.COMMIT_ID }})
            - MD5 (img): ${{ steps.locate_outputs.outputs.img_md5 }}
            - MD5 (zip): ${{ steps.locate_outputs.outputs.zip_md5 }}
          prerelease: true

      - name: Run LDCHECK (if enabled)
        if: inputs.LDCHECK == 'true'
        continue-on-error: true
        run: |
          ROOT_DIR="${{ env.OUTPUT_DIR }}/${{ inputs.DEVICE_NAME }}/recovery/root"
          if [ -d "$ROOT_DIR" ]; then
            cd tools
            [ -f libneeds ] && mv -n libneeds "$ROOT_DIR/"
            [ -f ldcheck ] && mv -n ldcheck "$ROOT_DIR/"
            cd "$ROOT_DIR"
            python3 ldcheck -p system/lib64:vendor/lib64:system/lib:vendor/lib -d ${{ inputs.LDCHECKPATH }}
            echo "LDCHECK completed."
          else
            echo "::warning::Recovery root not found, skipping LDCHECK."
          fi
